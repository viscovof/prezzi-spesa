
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prezzi Spesa</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
  font-family: -apple-system, sans-serif;
  background: #f5f4ef;
  color: #252920;
  max-width: 650px;
  margin: auto;
  padding: 18px;
}
.card {
  background: white;
  padding: 17px;
  border-radius: 15px;
  margin: 15px 0;
}
input, button {
  font: inherit;
  padding: 12px;
  border-radius: 9px;
  width: 100%;
  box-sizing: border-box;
  margin: 5px 0;
}
input { border: 1px solid #ddd; }
button {
  background: #344b38;
  color: white;
  border: 0;
  font-weight: bold;
}
button:disabled { opacity: .6; }
.secondary {
  background: #e9eee6;
  color: #344b38;
}
.item {
  border-top: 1px solid #eee;
  padding: 14px 0;
}
.price {
  font-size: 22px;
  font-weight: bold;
}
.small {
  color: #73766d;
  font-size: 13px;
}
.hidden { display: none !important; }
</style>
</head>

<body>
<h1>🛒 Prezzi Spesa</h1>
<p>Storico prezzi e occasioni per fare scorta.</p>

<section class="card" id="login">
  <h2>Il tuo account</h2>
  <input id="email" type="email" placeholder="La tua email"
         autocomplete="email">
  <input id="password" type="password"
         placeholder="Password (almeno 6 caratteri)"
         autocomplete="current-password">
  <button id="register" type="button">Registrati</button>
  <button id="signin" class="secondary" type="button">Accedi</button>
  <p class="small">Se richiesto, conferma l'indirizzo email prima di accedere.</p>
</section>

<section class="card hidden" id="app">
  <p id="account" class="small"></p>
  <button id="logout" class="secondary" type="button">Esci</button>

  <div class="card">
    <h2>📸 Fotografa lo scontrino</h2>
    <p class="small">Scatta una foto oppure scegli un'immagine dalla galleria.</p>
    <input id="receipt" type="file" accept="image/*" capture="environment">
    <p id="receiptMsg" class="small"></p>
    <div id="receiptChoices"></div>
  </div>

  <h2>Registra un prezzo</h2>
  <form id="form">
    <label for="name">Prodotto</label>
    <input id="name" required placeholder="Latte 1 litro">

    <label for="price">Prezzo pagato (€)</label>
    <input id="price" type="number" min="0" step=".01"
           required placeholder="2.20">

    <label for="target">Prezzo obiettivo (€)</label>
    <input id="target" type="number" min="0" step=".01"
           placeholder="1.90">

    <label for="date">Data</label>
    <input id="date" type="date" required>

    <label for="shop">Supermercato</label>
    <input id="shop" placeholder="Lidl">

    <label for="unit">Formato</label>
    <input id="unit" placeholder="1 litro">

    <button id="save" type="submit">Salva prezzo online</button>
  </form>
  <p id="msg" class="small"></p>
</section>

<section class="card hidden" id="history">
  <h2>I tuoi prezzi</h2>
  <input id="search" placeholder="Cerca prodotto">
  <div id="list"></div>
</section>

<script>
const client = supabase.createClient(
  "https://irxncadircstrrzjbqgi.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyeG5jYWRpcmNzdHJyempicWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTg2NTAsImV4cCI6MjEwNzM5NDY1MH0.jZmtd67sZPeuUfPlS_8lTJy7mXVUVzszjUj-TY3xC8w"
);

const $ = id => document.getElementById(id);
$("date").value = new Date().toLocaleDateString("sv-SE");

let prices = [];
let currentUser = null;
let loading = false;

function euro(n) {
  return Number(n).toLocaleString("it-IT", {
    style: "currency",
    currency: "EUR"
  });
}

function status(t) {
  $("msg").textContent = t;
}

async function showSession(session) {
  currentUser = session?.user || null;
  $("login").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  $("history").classList.toggle("hidden", !session);

  if (session) {
    $("account").textContent = "Account: " + session.user.email;
    await loadPrices();
  } else {
    prices = [];
    $("list").replaceChildren();
    $("msg").textContent = "";
  }
}

async function auth(mode) {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || password.length < 6) {
    alert("Inserisci l'email e una password di almeno 6 caratteri.");
    return;
  }

  $("signin").disabled = true;
  $("register").disabled = true;

  try {
    let result;

    if (mode === "register") {
      result = await client.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo:
            "https://viscovof.github.io/prezzi-spesa/app.html"
        }
      });

      if (!result.error && !result.data.session) {
        alert("Registrazione inviata. Controlla la tua email e conferma l'indirizzo, poi accedi.");
        return;
      }
    } else {
      result = await client.auth.signInWithPassword({
        email,
        password
      });
    }

    if (result.error) {
      alert("Errore: " + result.error.message);
    } else {
      await showSession(result.data.session);
    }
  } catch (error) {
    alert("Connessione non riuscita. Riprova.");
  } finally {
    $("signin").disabled = false;
    $("register").disabled = false;
  }
}

$("register").addEventListener("click", () => auth("register"));
$("signin").addEventListener("click", () => auth("signin"));

$("logout").addEventListener("click", async () => {
  const { error } = await client.auth.signOut();
  if (error) {
    alert("Non riesco a uscire: " + error.message);
  } else {
    await showSession(null);
  }
});

async function loadPrices() {
  if (!currentUser) return;

  const { data, error } = await client
    .from("prices")
    .select("*")
    .order("purchase_date", { ascending: false })
    .order("created_at", { ascending: false });

  if (error) {
    status("Errore nel caricamento: " + error.message);
    return;
  }

  prices = data || [];
  render();
  status("Prezzi aggiornati online.");
}

$("form").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) return;

  $("save").disabled = true;

  const payload = {
    product_name: $("name").value.trim(),
    price: Number($("price").value),
    target_price: $("target").value === ""
      ? null : Number($("target").value),
    purchase_date: $("date").value,
    store: $("shop").value.trim() || null,
    format: $("unit").value.trim() || null
  };

  try {
    const { error } = await client.from("prices").insert(payload);

    if (error) {
      status("Errore nel salvataggio: " + error.message);
      return;
    }

    $("form").reset();
    $("date").value = new Date().toLocaleDateString("sv-SE");
    await loadPrices();
  } catch (error) {
    status("Connessione non riuscita. Riprova.");
  } finally {
    $("save").disabled = false;
  }
});

$("search").addEventListener("input", render);

async function removePrice(id) {
  if (!confirm("Eliminare questa registrazione?")) return;

  const { error } = await client
    .from("prices")
    .delete()
    .eq("id", id);

  if (error) {
    status("Errore: " + error.message);
  } else {
    await loadPrices();
  }
}

function render() {
  const q = $("search").value.toLowerCase().trim();
  const rows = prices.filter(p =>
    p.product_name.toLowerCase().includes(q)
  );

  $("list").replaceChildren();

  if (!rows.length) {
    $("list").textContent = "Nessun prezzo registrato.";
    return;
  }

  rows.forEach(p => {
    const item = document.createElement("div");
    item.className = "item";

    const name = document.createElement("strong");
    name.textContent = p.product_name;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = euro(p.price);

    const details = document.createElement("div");
    details.className = "small";
    details.textContent =
      [p.purchase_date, p.store, p.format].filter(Boolean).join(" · ");

    item.append(name, price, details);

    if (p.target_price !== null) {
      const target = document.createElement("p");
      target.className = "small";
      target.textContent = Number(p.price) <= Number(p.target_price)
        ? "🎯 Obiettivo raggiunto: " + euro(p.target_price)
        : "Obiettivo: " + euro(p.target_price) +
          " · Mancano " + euro(Number(p.price) - Number(p.target_price));
      item.append(target);
    }

    const del = document.createElement("button");
    del.className = "secondary";
    del.textContent = "Elimina prezzo";
    del.addEventListener("click", () => removePrice(p.id));

    item.append(del);
    $("list").append(item);
  });
}

// Lettura dello scontrino tramite OCR
$("receipt").addEventListener("change", async function() {
  const file = this.files?.[0];
  if (!file) return;

  const msg = $("receiptMsg");
  const choicesBox = $("receiptChoices");
  msg.textContent = "Sto leggendo lo scontrino. Attendi: la prima volta può richiedere un po'.";
  choicesBox.replaceChildren();

  try {
    if (!window.Tesseract) {
      throw new Error("Strumento di lettura non caricato");
    }

    const result = await Tesseract.recognize(file, "ita+eng");
    const lines = result.data.text
      .split(/\r?\n/)
      .map(s => s.trim())
      .filter(Boolean);

    const items = [];

    for (const line of lines) {
      const match = line.match(
        /^(.+?)\s+(\d{1,4}[,.]\d{2})\s*€?\s*$/
      );

      if (match && match[1].trim().length > 1) {
        const name = match[1].trim();
        const price = Number(match[2].replace(",", "."));

        if (Number.isFinite(price)) {
          items.push({ name, price });
        }
      }
    }

    if (!items.length) {
      msg.textContent =
        "Non ho trovato righe riconoscibili. Prova una foto nitida, ben illuminata e completa.";
      return;
    }

    msg.textContent =
      "Ho trovato queste righe. Tocca il prodotto che vuoi registrare:";

    items.forEach(item => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "secondary";
      button.textContent = item.name + " — " + euro(item.price);

      button.addEventListener("click", () => {
        $("name").value = item.name;
        $("price").value = item.price.toFixed(2);
        msg.textContent =
          "Controlla i dati e completa supermercato, formato e obiettivo, se vuoi.";
        $("form").scrollIntoView({ behavior: "smooth", block: "start" });
        $("name").focus();
      });

      choicesBox.append(button);
    });
  } catch (error) {
    msg.textContent =
      "Non riesco a leggere la foto. Controlla la connessione e riprova con una foto più nitida.";
  }
});

client.auth.onAuthStateChange((_event, session) => {
  if (!loading) {
    loading = true;
    Promise.resolve().then(async () => {
      try {
        await showSession(session);
      } finally {
        loading = false;
      }
    });
  }
});

(async function init() {
  const { data, error } = await client.auth.getSession();

  if (error) {
    status("Errore di accesso: " + error.message);
    return;
  }

  await showSession(data.session);
})();
</script>

</body>
</html>
